<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DictionaryLite Online 📚</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>DictionaryLite Online</h1>
        <p>Kamus Real-Time (Membutuhkan Internet)</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Ketik kata Inggris..." onkeyup="handleKey(event)">
            <button onclick="searchWord()">Cari</button>
        </div>

        <div class="result-box">
            <h2 id="wordDisplay"></h2>
            <div id="phonetics"></div>
            <div id="definitionArea"></div>
        </div>

        <div class="footer">
            <p>Data disediakan oleh Free Dictionary API.</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
